<style type='text/css'>
body {
	perspective: 800px;
	perspective-origin: 50% 100px;
	padding-left: 8em;
}
ul {
	list-style-type: none;
	list-style: none;
	padding: 0;
	margin: 0;
	width: 100%;
	margin-bottom: 2em;
	display: flex;
	flex-direction: row;
	justify-content: space-between;
	align-items: stretch;
}
li {
	flex-grow: 1;
	margin: 0;
	padding: 0;
}
li > button {
	width: 100%;
	height: 100%;
}
bole-3d {
	--radius: 3em;
	--fond: pink;
	left: 11em;
}
bole-3d:after, bole-3d:before {
	content: none;
	display: block;
	width: 600%;
	height: 1200%;
	border-radius: 50%;
	position: absolute;
	left: -250%;
	top: -550%;
	background-color: transparent;
	background-image: radial-gradient(var(--fond), transparent, transparent);
}
bole-3d:before { transform: rotateY(90deg); }
.rond {
	border-radius: 100%;
	margin: 0;
	aspect-ratio: 1;
	/* --- */
	width: 3em;
	background-color: pink;
	background-image: radial-gradient(pink, green);
}
table-3d, chaise-3d {
	--bord: solid 4px maroon;
	--fond: brown;
}
table-3d {
	width: 10em;
	--depth: 8em;
	top: 15em;	/* fixé en fonction des hauteurs définies par l'utilisateur. ne peut être définie automatiquement */
	left: 45%;
}
chaise-3d {
	top: 13em;
	left: 20%;
	transform: rotateY(90deg);
}
</style></head><body>

	</ul>
	<piece-3d id='test-room' class='semi-losange carrelage-cabochon'>

		<bole-3d> </bole-3d>
		<table-3d></table-3d>
		<chaise-3d></chaise-3d>
		<p class='rond'></p>
	</piece-3d>
