<!DOCTYPE html><html><head>
	<title>soude au cou</title>
	<meta name='viewport' content='width=device-width,initial-scale=1'/>
	<meta charset='utf-8'/>
	<link rel='icon' type='image/svg+xml' href='../../site-dp/data/nounours-perso.svg'/>
<style type='text/css'>
body { text-align: center; }
div {
	display: grid;
	grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
	justify-items: stretch;
	align-items: stretch;
	min-width: 4cm;
	max-width: 12cm;
	margin: auto;
	border-style: solid;
	border-width: 4px;
	border-color: #666;
}
div.grille { aspect-ratio: 1; }
div.choice {
	height: 2em;
	margin-top: 1em;
}
p, button {
	box-sizing: border-box;
	padding: 0;
	margin: 0;
	border-color: #666;
	border-width: 2px;
	border-style: solid;
	outline: none;
}
p.fixe { background-image: radial-gradient(transparent 70%, #666); }
p:focus, button:focus, p.current {
	background-image: radial-gradient(#666 2%, transparent 50%);
}
p:nth-child(3n) { border-right-width: 4px; }
p:nth-child(9n-8) { border-left-width: 4px; }
p:nth-child(-n+9) { border-top-width: 4px; }
p:nth-child(27n-8), p:nth-child(27n-7), p:nth-child(27n-6),
p:nth-child(27n-5), p:nth-child(27n-4), p:nth-child(27n-3),
p:nth-child(27n-2), p:nth-child(27n-1), p:nth-child(27n)
	{ border-bottom-width: 4px; }
*.case-1 { background-color: #0EC; }
*.case-2 { background-color: #09F; }
*.case-3 { background-color: #96F; }
*.case-4 { background-color: #F0F; }
*.case-5 { background-color: #F69; }
*.case-6 { background-color: #F93; }
*.case-7 { background-color: #FC0; }
*.case-8 { background-color: #CC0; }
*.case-9 { background-color: #3C0; }
</style></head><body>
	<h1>grille de sudoku</h1>
	<div class='grille'>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
	</div>
	<div class='choice'>
		<button onclick='selectValue(this)' class='case-1'></button>
		<button onclick='selectValue(this)' class='case-2'></button>
		<button onclick='selectValue(this)' class='case-3'></button>
		<button onclick='selectValue(this)' class='case-4'></button>
		<button onclick='selectValue(this)' class='case-5'></button>
		<button onclick='selectValue(this)' class='case-6'></button>
		<button onclick='selectValue(this)' class='case-7'></button>
		<button onclick='selectValue(this)' class='case-8'></button>
		<button onclick='selectValue(this)' class='case-9'></button>
	</div>
	<script type='text/javascript'>
/*
dépendances: list.js, sudoku.css, structure.css
*/
var tableau =[
	[ '1', '2', '3', '4', '5', '6', '7', '8', '9' ],
	[ [], [], [], [], [], [], [], [], [] ],
	[ [], [], [], [], [], [], [], [], [] ],
	[ [], [], [], [], [], [], [], [], [] ],
	[ [], [], [], [], [], [], [], [], [] ],
	[ [], [], [], [], [], [], [], [], [] ],
	[ [], [], [], [], [], [], [], [], [] ],
	[ [], [], [], [], [], [], [], [], [] ],
	[ [], [], [], [], [], [], [], [], [] ]
];
Array.prototype.randomPosition = function(){
	if (this.length ===0) return -1;
	else if (this.length ===1) return 0;
	var posFloat = Math.random();
	posFloat = posFloat * this.length;
	const pos = Math.floor (posFloat);
	return pos;
}
Array.prototype.randomValue = function(){
	const pos = this.randomPosition();
	if (pos ===-1) return null;
	else return this[pos];
}
Array.prototype.randomValueSpliced = function(){
	const pos = this.randomPosition();
	if (pos ===-1) return null;
	else return this.splice (pos, 1)[0];
}
Array.prototype.shuffle = function(){
	var pos =-1;
	var newList =[];
	while (this.length >0) newList.push (this.randomValueSpliced());
	return newList;
}
Array.prototype.remove = function (valeurCase){
	const pos = this.indexOf (valeurCase);
	if (pos >=0) var trash = this.splice (pos, 1);
}
tableau[0] = tableau[0].shuffle();
function fillTable(){
	var emptyCases = false;
	for (var i=1; i<9; i++){
		var posI = i%3;
		for (var j=0; j<9; j++){
			tableau[i][j] =[ '1', '2', '3', '4', '5', '6', '7', '8', '9' ];
			// vérifier les lignes
			for (var k=0; k<j; k++){ if (tableau[i][j].includes (tableau[i][k])) tableau[i][j].remove (tableau[i][k]); }
			// vérifier les colonnes
			for (var k=0; k<i; k++){ if (tableau[i][j].includes (tableau[k][j])) tableau[i][j].remove (tableau[k][j]); }
			// vérifier les carrés
			var posJ = j%3;
			if (posI >=1){
				if (posJ ===0 && tableau[i][j].includes (tableau[i-1][j+2])) tableau[i][j].remove (tableau[i-1][j+2]);
				if (posJ <=1 && tableau[i][j].includes (tableau[i-1][j+1])) tableau[i][j].remove (tableau[i-1][j+1]);
				if (posJ >=1 && tableau[i][j].includes (tableau[i-1][j-1])) tableau[i][j].remove (tableau[i-1][j-1]);
				if (posJ ===2 && tableau[i][j].includes (tableau[i-1][j-2])) tableau[i][j].remove (tableau[i-1][j-2]);
			}
			if (posI ===2){
				if (posJ ===0 && tableau[i][j].includes (tableau[i-2][j+2])) tableau[i][j].remove (tableau[i-2][j+2]);
				if (posJ <=1 && tableau[i][j].includes (tableau[i-2][j+1])) tableau[i][j].remove (tableau[i-2][j+1]);
				if (posJ >=1 && tableau[i][j].includes (tableau[i-2][j-1])) tableau[i][j].remove (tableau[i-2][j-1]);
				if (posJ ===2 && tableau[i][j].includes (tableau[i-2][j-2])) tableau[i][j].remove (tableau[i-2][j-2]);
			}
			// --------------------
			if (tableau[i][j].length ===0) emptyCases = true;
			tableau[i][j] = tableau[i][j].randomValue();
	}}
	if (emptyCases) fillTable();
}
fillTable();
// afficher les cases. garder certaines vides
function showValue(){
	if (Math.random() <0.6) return true;
	else return false;
}
// interractivité
HTMLParagraphElement.prototype.makeInterractive = function(){
	this.className = 'interractive';
	this.setAttribute ('tabindex', '1');
	this.addEventListener ('click', selectCase);
}
var currentCase = null;
function selectCase (event){
	if (currentCase) currentCase.classList.remove ('current');
	currentCase = event.target;
	currentCase.className = currentCase.className + 'current';
}
const cases = document.getElementsByTagName ('p');
for (var i=0; i<9; i++){
	for (var j=0; j<9; j++){
		if (showValue()) cases[i*9+j].className = 'fixe case-' + tableau[i][j];
		else cases[i*9+j].makeInterractive();
}}
function selectValue (button){
	currentCase.className = 'interractive current '+ button.className;
}
	</script>
</body></html>
