	<script type='text/javascript'>
for (var i=0; i<9; i++){
	for (var j=0; j<9; j++){
		if (showValue()){
			cases[i*9+j].className = 'fixe';
			cases[i*9+j].innerHTML = tableau[i][j];
		}
		else cases[i*9+j].makeInterractive();
}}
function selectValue (button){ currentCase.innerHTML = button.innerHTML; }
function newGrid(){
	fillTable();
	const grille = document.body.getElementsByTagName ('div')[0];
	grille.innerHTML = '<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>';
	for (var i=0; i<9; i++){
		for (var j=0; j<9; j++){
			if (showValue()){
				cases[i*9+j].className = 'fixe';
				cases[i*9+j].innerHTML = tableau[i][j];
			}
			else cases[i*9+j].makeInterractive();
}}}
