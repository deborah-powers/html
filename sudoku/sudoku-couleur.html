<!DOCTYPE html><html><head>
	<title>soude au cou</title>
	<meta name='viewport' content='width=device-width,initial-scale=1'/>
	<meta charset='utf-8'/>
	<link rel='icon' type='image/svg+xml' href='../../site-dp/data/nounours-perso.svg'/>
	<link rel='stylesheet' type='text/css' href='sudoku-style.css'/>
<style type='text/css'>
p.fixe {
	background-image:
		radial-gradient(circle at 0.1em 0.1em, #666 0.1em, transparent 0.1em),
		radial-gradient(circle at 0.6em 0.6em, #666 0.1em, transparent 0.1em);
	background-size: 1em 1em;
	background-repeat: repeat;
}
p:focus, button:focus, p.current { background-image: radial-gradient(transparent 75%, #666); }
*.case-1 { background-color: red; }
*.case-2 { background-color: #96F; }
*.case-3 { background-color: #06F; }
*.case-4 { background-color: #0CC; }
*.case-5 { background-color: #3C0; }
*.case-6 { background-color: #CC0; }
*.case-7 { background-color: #F93; }
*.case-8 { background-color: #C66; }
*.case-9 { background-color: #E0E; }
</style></head><body>
	<h1>grille de sudoku</h1>
	<div class='grille'>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
		<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
	</div>
	<div class='choice'>
		<button onclick='selectValue(this)' class='case-1'></button>
		<button onclick='selectValue(this)' class='case-2'></button>
		<button onclick='selectValue(this)' class='case-3'></button>
		<button onclick='selectValue(this)' class='case-4'></button>
		<button onclick='selectValue(this)' class='case-5'></button>
		<button onclick='selectValue(this)' class='case-6'></button>
		<button onclick='selectValue(this)' class='case-7'></button>
		<button onclick='selectValue(this)' class='case-8'></button>
		<button onclick='selectValue(this)' class='case-9'></button>
	</div>
	<button onclick='newGrid()'>nouvelle grille</button>
	<script type='text/javascript' src='sudoku-script.js'></script>
	<script type='text/javascript'>
for (var i=0; i<9; i++){
	for (var j=0; j<9; j++){
		if (showValue()) cases[i*9+j].className = 'fixe case-' + tableau[i][j];
		else cases[i*9+j].makeInterractive();
}}
function selectValue (button){ currentCase.className = 'interractive current '+ button.className; }
function newGrid(){
	fillTable();
	const grille = document.body.getElementsByTagName ('div')[0];
	grille.innerHTML = '<p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>';
	for (var i=0; i<9; i++){
		for (var j=0; j<9; j++){
			if (showValue()) cases[i*9+j].className = 'fixe case-' + tableau[i][j];
			else cases[i*9+j].makeInterractive();
}}}
	</script>
</body></html>
