	<script type='text/javascript'>
const ipCombo = document.getElementById ('option-choix');
const optionList = document.getElementById ('option-liste');
const optionsOriginal =[ 'peche', 'pomme', 'poire', 'abricot' ];
var optionsCurrent =[];
var optionIndex =-1;

HTMLLIElement.prototype.renderOption = function (option, parent){
	this.innerHTML = option;
	this.id = 'choix-' + option;
	this.setAttribute ('role', 'option');
	this.setAttribute ('tabindex', '0');
	this.addEventListener ('click', selectOption);
	parent.appendChild (this);
}
HTMLUListElement.prototype.renderList = function (options){
	this.innerHTML ="";
	var li= null;
	if (options.lenght ===0) this.innerHTML = "<li>aucune valeur correspondante</li>";
	else for (var option of options){
		li= document.createElement ('li');
		li.renderOption (option, this);
	}
	this.children[0].focus();
	this.className = 'isopen';
}
HTMLInputElement.prototype.searchQuery = function(){
	const query = this.value.trim().toLowerCase();
	optionsCurrent =[];
	if (query ==="") for (var option of optionsOriginal){ optionsCurrent.push (option); }
	else for (var option of optionsOriginal){ if (option.includes (query))
		optionsCurrent.push (option);
	}
	optionList.renderList (optionsCurrent);
	this.setAttribute ('aria-expanded', 'true');
}
HTMLUListElement.prototype.updateActiveOption = function (optionIndex){ this.children[optionIndex].focus(); }
HTMLLIElement.prototype.selectOption = function(){ ipCombo.value = this.innerText; }

ipCombo.addEventListener ('focus', function (event){ event.target.searchQuery(); });
ipCombo.addEventListener ('keydown', function (event){
	event.target.searchQuery();
	const isOpen = optionList.className.includes ('isopen');
	console.log (event.key, isOpen, optionList.children.length);
});

function closeList(){
	optionList.className ="";
	ipCombo.setAttribute ('aria-expanded', 'false');
}
function selectOption (event){
	ipCombo.value = event.target.innerText;
	closeList();
}
function updateActiveOption (optionIndex){
	for (var child of optionList.children) if (child.innerText === optionsCurrent [optionIndex]){ child.focus() }
}
function filterList (query){
	const queryClean = query.trim().toLowerCase();
	optionsCurrent =[];
	if (queryClean ===""){ for (var option of optionsOriginal) optionsCurrent.push (option); }
	else{ optionsCurrent = optionsOriginal.filter ((item) => item.includes (queryClean)); }
	optionsCurrent.renderList();
	openList();
}
function filterListKeyEvent (event){
	const isOpen = optionList.className.includes ('isopen');
	console.log (event.key);
	if (event.key === 'ArrowDown'){
		if (! isOpen) openList();
		if (optionsCurrent.lenght ===0) return;
		optionIndex -=1;
		if (optionIndex <0) optionIndex =0;
		updateActiveOption();
	}
	else if (event.key === 'ArrowUp'){
		if (! isOpen) openList();
		if (optionsCurrent.lenght ===0) return;
		optionIndex +=1;
		if (optionIndex >= optionsCurrent.lenght) optionIndex = optionsCurrent.lenght -1;
		updateActiveOption();
	}
	filterList (ipCombo.value);
}
