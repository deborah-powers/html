	<h2>les listes combobox</h2>
	<p><a href='https://blog.crea-troyes.fr/10868/coder-une-combobox-en-css-et-js-guide-code-complet/#aioseo-le-html-dune-combobox-poser-des-bases-solides-32'>tutoriel</a></p>
	<label for='option-choix'>choisir une option</label>
	<input type='text' id='option-choix' role='combobox' aria-autocomplete='list' aria-expanded='false' aria-haspopup='listbox' data-active-option='choix-1' aria-controls='option-liste' />
	<ul role='listbox' id='option-liste'>
		<li role='option' id='choix-1'></li>
	</ul>
	<script type='text/javascript'>
const ipCombo = document.getElementById ('option-choix');
const optionList = document.getElementById ('option-liste');
const optionsOriginal =[ 'peche', 'pomme', 'poire', 'abricot' ];

function selectOption (event){
	ipCombo.value = event.target.innerText;
	event.target.parentElement.className ="";
}
HTMLLIElement.prototype.renderOption = function (option, parent){
	this.innerHTML = option;
	this.id = 'choix-' + option;
	this.setAttribute ('role', 'option');
	this.setAttribute ('tabindex', '0');
	this.addEventListener ('click', selectOption);
	parent.appendChild (this);
}
HTMLUListElement.prototype.renderList = function (options){
	this.innerHTML ="";
	var li= null;
	if (options.length ===0) this.innerHTML = "<li>aucune valeur correspondante</li>";
	else for (var option of options){
		li= document.createElement ('li');
		li.renderOption (option, this);
	}
	this.className = 'isopen';
}
HTMLInputElement.prototype.searchQuery = function(){
	const query = this.value.trim().toLowerCase();
	var optionsCurrent =[];
	if (query ==="") for (var option of optionsOriginal){ optionsCurrent.push (option); }
	else for (var option of optionsOriginal){ if (option.includes (query))
		optionsCurrent.push (option);
	}
	optionList.renderList (optionsCurrent);
	this.setAttribute ('aria-expanded', 'true');
}
ipCombo.addEventListener ('focus', function (event){ event.target.searchQuery(); });
ipCombo.addEventListener ('keyup', function (event){
	if (event.key === 'ArrowDown') optionList.children[0].focus();
	else if (event.key === 'ArrowUp') optionList.children [optionList.children.length -1].focus();
	else event.target.searchQuery();
});
optionList.addEventListener ('keyup', function (event){
	var optionIndex = -1;
	for (var o=0; o< optionList.children.length; o++)
		if (optionList.children[o].id === document.activeElement.id){ optionIndex =o; }
	if (event.key === 'ArrowDown') optionIndex +=1;
	else if (event.key === 'ArrowUp') optionIndex -=1;
	if (optionIndex <0 || optionIndex >= optionList.children.length) ipCombo.focus();
	else  optionList.children [optionIndex].focus();
});
	</script>
