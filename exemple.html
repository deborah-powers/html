function toRadians (degrees){
	degrees *= Math.PI;
	degrees /=180;
	return degrees;
}
function findNearStop (pos){
	// latitude. 1 degré = 111.133 km
	const deltaXgps =0.0001;
	const deltaYgps =0.0001;
	const deltaYmeter = deltaYgps * 40008000 / 360;
	const circumferenceY = 40075160 * Math.cos (toRadians (pos.coords.latitude));
	const deltaXmeter = deltaXgps * circumferenceY /360;
	console.log (deltaXmeter, deltaYmeter);
}
